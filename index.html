<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1b1510">
<link rel="manifest" href="manifest.json"><link rel="preload" as="image" href="tomb-left.jpg"><link rel="preload" as="image" href="tomb-right.jpg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Leila's Log</title>
<style>
:root{--bg:#1b1510;--st:#3a3025;--st2:#554733;--gold:#c9a24a;--tx:#efe3c8;--mu:#a8987a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px Georgia,serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:720px;margin:auto;padding:14px 14px 80px}h1,h2{font-variant:small-caps;color:var(--gold);margin:.3em 0}
.sub{color:var(--mu);font-style:italic}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.card,.tile{background:linear-gradient(145deg,var(--st2),var(--st));border:1px solid #6b5a45;border-radius:10px;padding:12px;margin:8px 0}
.tile{text-align:center;min-width:42%;font-size:18px;position:relative;overflow:hidden}.tile b{display:block;font-size:28px;color:var(--gold)}
.tile.crack{animation:sh .35s}@keyframes sh{20%{transform:translate(-3px,2px)}60%{transform:translate(3px,-2px)}}
.tile.crack::after{content:"";position:absolute;inset:0;background:linear-gradient(60deg,transparent 48%,#000 49% 50%,transparent 51%),linear-gradient(120deg,transparent 60%,#000 61% 62%,transparent 63%)}
button,input,select,textarea{font:inherit;color:var(--tx);background:#2a2219;border:1px solid #6b5a45;border-radius:8px;padding:10px;width:100%}
button{background:var(--st2);cursor:pointer;width:auto}button.p{background:var(--gold);color:#1b1510;font-weight:bold}
label{display:block;margin-top:10px;color:var(--mu);font-size:14px}.chip{display:inline-block;width:auto;margin:3px;padding:6px 10px;border-radius:16px}.chip.on{background:var(--gold);color:#1b1510}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#120e0a;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #6b5a45}nav button{flex:1;border:0;border-radius:0;background:none;padding:14px}nav .on{color:var(--gold)}
.th{width:100%;height:150px;object-fit:cover;border-radius:6px}.gal img{height:140px;margin:3px;border-radius:6px}.kv{display:flex;justify-content:space-between;border-bottom:1px solid #3a3025;padding:6px 0}.kv span:first-child{color:var(--mu)}
#tomb{position:fixed;inset:0;z-index:9;background:#050302;overflow:hidden;transition:opacity .9s ease}
#tomb.out{opacity:0}
.glow{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 52%,#fff0c8 0,#f0b255 14%,#a8631d 38%,#4a2a0c 62%,#0c0905 88%);opacity:0;transition:opacity 4.5s ease-in 1.4s}
.door{position:absolute;top:0;bottom:0;width:50.2%;z-index:2;overflow:hidden;will-change:transform;background-repeat:no-repeat;background-size:cover;transition:transform 5s cubic-bezier(.55,0,.3,1) 1.8s}
.dl{left:0;background-image:url(tomb-left.jpg);background-position:right center}
.dr{right:0;background-image:url(tomb-right.jpg);background-position:left center}
.door::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 22%,transparent 70%,rgba(0,0,0,.6))}
.door::after{content:"";position:absolute;top:0;bottom:0;width:14px;z-index:3}
.dl::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.5))}.dr::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.5))}
.cr{position:absolute;inset:0;width:100%;height:100%;z-index:2;filter:drop-shadow(0 0 2px rgba(255,150,50,.85))}
.cr path{fill:none;stroke:#080402;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.open .cr path{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s ease-out}
.open .dl{transform:translateX(-101%)}.open .dr{transform:translateX(101%)}.open .glow{opacity:1}
.open .door{animation:rum 1.8s linear}@keyframes rum{0%,100%{translate:0 0}12%{translate:-2px 1px}25%{translate:2px -1px}40%{translate:-3px 0}55%{translate:2px 1px}70%{translate:-2px -1px}85%{translate:1px 0}}
.beam{position:absolute;top:0;bottom:0;left:50%;width:4px;transform:translateX(-50%);z-index:3;opacity:0;pointer-events:none;background:linear-gradient(180deg,transparent,#ffe2a8 15%,#ffe2a8 85%,transparent);box-shadow:0 0 26px 12px rgba(255,170,70,.75)}
.open .beam{animation:bm 5.5s ease-out 1s forwards}@keyframes bm{0%{opacity:0}20%{opacity:1}65%{opacity:.8}100%{opacity:0}}
#dust{position:absolute;inset:0;z-index:4;pointer-events:none}
#dust i{position:absolute;border-radius:50%;background:rgba(255,222,165,.85);opacity:0;filter:blur(1px)}
.open #dust i{animation-name:dst;animation-fill-mode:forwards;animation-timing-function:ease-out}
@keyframes dst{0%{opacity:0;transform:translate(0,0)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),80px)}}
#tt{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);z-index:5;text-align:center;opacity:0;pointer-events:none}
#tt::before{content:"";position:absolute;left:-10%;right:-10%;top:-70px;bottom:-70px;background:radial-gradient(ellipse,rgba(10,7,4,.72),transparent 68%);z-index:-1}
#tt h1,#tt p{text-shadow:0 2px 10px #000}
#tq{margin:.4em 24px 0;font-size:15px;color:#e8d9b8}
.open #tt{opacity:1;transition:opacity 1.8s ease 4s}
#ts{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 56px);z-index:5;margin:0;text-align:center;color:var(--tx);font-style:italic;font-size:15px;text-shadow:0 2px 8px #000;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.45}}
.open #ts{animation:fo 7s forwards}@keyframes fo{0%,70%{opacity:1}100%{opacity:0}}
#mu{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(18,14,10,.75);border:1px solid var(--gold);font-size:20px;line-height:1}
</style></head><body>

<div id="tt"><h1 style="font-size:34px">Leila's Log</h1><p id="tq" class="sub">&ldquo;Walk far, look well &mdash; every horizon is a page.&rdquo;</p></div>
<p id="ts">Tap to enter the tomb</p></div>
<button id="mu" aria-label="Mute or unmute music">&#128266;</button>
<div id="app"></div>
<nav><button data-v="home" class="on">Expedition</button><button data-v="archive">Archive</button><button data-v="camp">Camp</button></nav>
<audio id="aud" src="music.mp3" loop></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CATS={mineral:'Mineral',fossil:'Fossil',artifact:'Artifact',other:'Other'};
const COLORS="Black,White,Blue,Brown,Green,Orange,Red,Yellow,Pink,Purple,Gray,Gold,Silver,Multi-color,Amber,Tan,Copper,Coral".split(',');
const T={mineral:[['species','Mineral species',1],['variety','Variety / form'],['locality','Locality',1],['dimensions','Dimensions'],['weight','Weight'],['condition','Condition'],['system','Crystal system']],
fossil:[['taxon','Taxon',1],['period','Geological period'],['formation','Formation'],['locality','Locality',1],['matrix','Matrix'],['dimensions','Dimensions'],['completeness','Completeness'],['prep','Preparation']],
artifact:[['type','Object type',1],['culture','Culture / period'],['material','Material'],['provenance','Provenance',1],['dimensions','Dimensions'],['condition','Condition'],['authenticity','Authenticity']],
other:[['type','Item type'],['description','Description'],['locality','Source / locality'],['dimensions','Dimensions'],['condition','Condition']]};
const MAIN={mineral:'species',fossil:'taxon',artifact:'type',other:'type'},PLACE={mineral:'locality',fossil:'locality',artifact:'provenance',other:'locality'};
const ROLES=['front','back','label','scale','detail','matrix','other'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DB,S=[],view='home',q={q:'',cat:'',sort:'name',acq:''},cur=null,seen=false;
// ---- storage (IndexedDB) ----
const idb=()=>new Promise((r,j)=>{const o=indexedDB.open('leilas-journal',1);o.onupgradeneeded=()=>o.result.createObjectStore('s',{keyPath:'id'});o.onsuccess=()=>r(o.result);o.onerror=j});
const tx=(m,f)=>new Promise((r,j)=>{const t=DB.transaction('s',m);const x=f(t.objectStore('s'));t.oncomplete=()=>r(x.result);t.onerror=j});
const load=async()=>{S=await tx('readonly',s=>s.getAll())};
const save=async x=>{await tx('readwrite',s=>s.put(x));const i=S.findIndex(z=>z.id===x.id);i<0?S.push(x):S[i]=x};
const del=async id=>{await tx('readwrite',s=>s.delete(id));await load()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const disp=x=>x.value||x.price||'';const money=n=>n?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n):'';
// ---- image helper ----
const shrink=blob=>new Promise(r=>{const i=new Image(),u=URL.createObjectURL(blob);i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r(null);i.src=u});
// ---- tomb ----
const AU=$('#aud'),mu=$('#mu');let muted=false;try{muted=localStorage.getItem('lj-mute')==='1'}catch(e){}
const paint=()=>{mu.innerHTML=muted?'&#128263;':'&#128266;';AU.muted=muted;mu.setAttribute('aria-pressed',muted)};paint();
mu.onclick=e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('lj-mute',muted?'1':'0')}catch(x){}paint();if(!muted&&view==='home')AU.play().catch(()=>{})};
(()=>{const d=$('#dust');for(let i=0;i<34;i++){const e=document.createElement('i'),z=2+Math.random()*4;e.style.cssText=`left:${46+Math.random()*8}%;top:${10+Math.random()*80}%;width:${z}px;height:${z}px;--dx:${(Math.random()-.5)*160}px;animation-delay:${1.4+Math.random()*3}s;animation-duration:${2.5+Math.random()*3}s`;d.appendChild(e)}})();
$('#tomb').onclick=function once(){if(seen)return;seen=true;$('#ts').textContent='Ancient seals breaking…';AU.play().catch(()=>{});const t=$('#tomb');t.classList.add('open');navigator.vibrate&&navigator.vibrate([60,40,60,40,120]);setTimeout(()=>t.classList.add('out'),8200);setTimeout(()=>t.style.display='none',9200)};
// ---- nav ----
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v,o){view=v;if(o)Object.assign(q,o);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));v==='home'?$('#aud').play().catch(()=>{}):$('#aud').pause();render();scrollTo(0,0)}
function render(){({home,archive,camp,detail,form})[view]()}
// ---- home ----
function home(){const tot=S.reduce((a,x)=>a+(+disp(x)||0),0);
$('#app').innerHTML=`<h1>Leila's Log</h1><p class="sub">logging specimens as a renowned explorer of earth, bone, and ancient craft</p>
<div class="row"><div class="card"><b>${S.length}</b><br>specimens catalogued</div><div class="card"><b>${money(tot)||'$0'}</b><br>expedition value</div></div>
<h2>Choose your chamber</h2><div class="row">${Object.entries(CATS).map(([k,v])=>`<div class="tile" data-c="${k}">${v}<b>${S.filter(x=>x.cat===k).length}</b></div>`).join('')}</div>
<h2>Recent discoveries</h2>${[...S].sort((a,b)=>b.added-a.added).slice(0,5).map(x=>`<div class="card" data-id="${x.id}">${esc(x.name)} <span class="sub">· ${CATS[x.cat]}</span></div>`).join('')}
<button class="p" id="add">+ Log new discovery</button>`;
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{t.classList.add('crack');navigator.vibrate&&navigator.vibrate(60);setTimeout(()=>go('archive',{cat:t.dataset.c}),450)});
document.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>show(c.dataset.id));$('#add').onclick=()=>edit()}
// ---- archive ----
function archive(){const hay=x=>[x.name,x.notes,x.tags.join(' '),Object.values(x.f).join(' '),x.storage,x.sid,x.folder].join(' ').toLowerCase();
let l=S.filter(x=>(!q.cat||x.cat===q.cat)&&(!q.acq||x.acquired===q.acq)&&hay(x).includes(q.q.toLowerCase()));
l.sort((a,b)=>q.sort==='value'?(+disp(b)||0)-(+disp(a)||0):q.sort==='date'?(b.year||0)-(a.year||0):a.name.localeCompare(b.name));
$('#app').innerHTML=`<h1>Archive</h1><input id="sq" placeholder="Search name, notes, tags, fields, SID…" value="${esc(q.q)}">
<div class="row"><select id="fc"><option value="">All categories</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${q.cat===k?'selected':''}>${v}</option>`).join('')}</select>
<select id="fa"><option value="">Any acquisition</option>${['Purchased','Found','Unknown'].map(v=>`<option ${q.acq===v?'selected':''}>${v}</option>`).join('')}</select>
<select id="so">${['name','date','value'].map(v=>`<option value="${v}" ${q.sort===v?'selected':''}>Sort: ${v}</option>`).join('')}</select></div>
<p class="sub">${l.length} specimens</p><button class="p" id="add">+ Add specimen</button>
${l.map(x=>`<div class="card" data-id="${x.id}">${x.photos[0]?`<img class="th" src="${x.photos[0].data}">`:''}<b>${esc(x.name)}</b><br><span class="sub">${CATS[x.cat]}${x.year?' · '+x.year:''}${disp(x)?' · '+money(disp(x)):''}</span></div>`).join('')}`;
$('#sq').oninput=e=>{q.q=e.target.value;const p=e.target.selectionStart;archive();$('#sq').focus();$('#sq').setSelectionRange(p,p)};
$('#fc').onchange=e=>{q.cat=e.target.value;archive()};$('#fa').onchange=e=>{q.acq=e.target.value;archive()};$('#so').onchange=e=>{q.sort=e.target.value;archive()};
document.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>show(c.dataset.id));$('#add').onclick=()=>edit()}
// ---- detail ----
function show(id){cur=S.find(x=>x.id===id);go('detail')}
function detail(){const x=cur,kv=(k,v)=>v||v===0?`<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`:'';
$('#app').innerHTML=`<button id="bk">← Back</button><h1>${esc(x.name)}</h1><p class="sub">${CATS[x.cat]}</p>
<div class="gal">${x.photos.map(p=>`<img src="${p.data}" title="${p.role}">`).join('')}</div>
${x.tags.length?`<p>${x.tags.map(t=>`<span class="chip on">${esc(t)}</span>`).join('')}</p>`:''}
<div class="card"><h2>Value</h2>${kv('Current value',money(x.value))}${kv('Purchase price',money(x.price))}${kv('Purchase date',x.pdate)}${kv('Display value',money(disp(x)))}</div>
<div class="card"><h2>Acquisition & storage</h2>${kv('SID',x.sid)}${kv('Folder',x.folder)}${kv('Date',x.year)}${kv('Acquired',x.acquired)}${kv('Source',x.source)}${kv('Storage',x.storage)}</div>
<div class="card"><h2>Details</h2>${T[x.cat].map(([k,l])=>kv(l,x.f[k])).join('')}${kv('Color',(x.colors||[]).join(', '))}</div>
${x.notes?`<div class="card"><h2>Notes</h2>${esc(x.notes)}</div>`:''}
<div class="row"><button id="ed" class="p">Edit</button><button id="dl">Delete</button></div>`;
$('#bk').onclick=()=>go('archive');$('#ed').onclick=()=>edit(x);$('#dl').onclick=async()=>{if(confirm('Delete this specimen?')){await del(x.id);go('archive')}}}
// ---- form ----
let draft;
function edit(x){draft=x?JSON.parse(JSON.stringify(x)):{id:uid(),added:Date.now(),name:'',cat:q.cat||'mineral',tags:[],notes:'',storage:'',folder:'',price:'',pdate:'',value:'',year:'',acquired:'',source:'',sid:'',photos:[],f:{},colors:[]};cur=x||null;go('form')}
function form(){const d=draft,inp=(k,l,t='text')=>`<label>${l}<input data-k="${k}" type="${t}" value="${esc(d[k])}"></label>`;
$('#app').innerHTML=`<h1>${cur?'Edit':'Log'} discovery</h1>
<label>Category<select id="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${d.cat===k?'selected':''}>${v}</option>`).join('')}</select></label>
${inp('name','Name *')}
${T[d.cat].map(([k,l,r])=>`<label>${l}${r?' *':''}<input data-f="${k}" value="${esc(d.f[k])}"></label>`).join('')}
<label>Color</label><div id="cols">${COLORS.map(c=>`<button class="chip ${d.colors.includes(c)?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
<label>Tags (comma-separated)<input id="tags" value="${esc(d.tags.join(', '))}"></label>
${inp('storage','Storage location')}${inp('price','Purchase price','number')}${inp('pdate','Purchase date','date')}${inp('value','Current value','number')}${inp('year','Date (year)','number')}
<label>Acquired</label><div>${['Purchased','Found','Unknown'].map(a=>`<button class="chip ${d.acquired===a?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>
${inp('source','Source (dealer, show, trade, gift…)')}
<label>Notes<textarea data-k="notes" rows="4">${esc(d.notes)}</textarea></label>
<label>Photos<input type="file" id="ph" accept="image/*" multiple></label>
<div>${d.photos.map((p,i)=>`<div class="row"><img class="th" style="height:70px;flex:0 0 90px" src="${p.data}"><select data-r="${i}">${ROLES.map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select><button data-x="${i}">✕</button></div>`).join('')}</div>
<div class="row" style="margin-top:14px"><button id="sv" class="p">Save</button><button id="cn">Cancel</button></div>`;
const A=$('#app');
A.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>d[e.dataset.k]=e.value);A.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>d.f[e.dataset.f]=e.value);
A.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;d.colors=d.colors.includes(c)?d.colors.filter(z=>z!==c):[...d.colors,c];b.classList.toggle('on')});
A.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{d.acquired=d.acquired===b.dataset.a?'':b.dataset.a;A.querySelectorAll('[data-a]').forEach(z=>z.classList.toggle('on',z.dataset.a===d.acquired))});
A.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>d.photos[e.dataset.r].role=e.value);A.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{d.photos.splice(b.dataset.x,1);form()});
$('#cat').onchange=e=>{d.cat=e.target.value;form()};
$('#ph').onchange=async e=>{for(const f of e.target.files){const u=await shrink(f);if(u)d.photos.push({data:u,role:'front'})}form()};
$('#cn').onclick=()=>cur?show(cur.id):go('archive');
$('#sv').onclick=async()=>{d.tags=$('#tags').value.split(',').map(s=>s.trim()).filter(Boolean);
const miss=[!d.name&&'Name',...T[d.cat].filter(t=>t[2]&&!d.f[t[0]]).map(t=>t[1])].filter(Boolean);if(miss.length)return alert('Required: '+miss.join(', '));
await save(d);show(d.id)}}
// ---- first-app JSON converter ----
const conv=x=>{const f={},fv=x.fieldValues||{};let colors=[];for(const k in fv){if(k==='colors')colors=fv[k]||[];else f[k==='objectType'?'type':k]=fv[k]}
return {id:uid(),added:Date.parse(x.createdAt)||Date.now(),name:x.name,cat:x.category,tags:x.tags||[],notes:x.notes||'',storage:x.storageLocation||'',folder:'',price:x.purchasePrice||'',pdate:x.purchaseDate||'',value:x.currentValue||'',year:x.dateYear||'',acquired:({purchased:'Purchased',found:'Found',unknown:'Unknown'})[x.acquisitionMethod]||'',source:x.acquisitionSource||'',sid:x.sortlySid||'',photos:[],pending:[...(x.photos||[])].sort((a,b)=>a.sortOrder-b.sortOrder).map(p=>({path:p.relativePath,role:p.role})),f,colors}};
// ---- camp ----
function camp(){$('#app').innerHTML=`<h1>Camp</h1>
<div class="card"><h2>Import from Sortly</h2><p class="sub">Choose your three Excel/CSV exports. File name decides category: "mineral", "fossil", otherwise artifact ("misc").</p><input type="file" id="imp" accept=".xlsx,.xls,.csv" multiple><label><input type="checkbox" id="nop" checked style="width:auto"> Skip photo downloads (attach photos separately below)</label><progress id="ipr" value="0" max="1" style="width:100%"></progress><p id="ilog">Waiting for a file…</p></div>
<div class="card"><h2>Attach photos from folder</h2><p class="sub">Select the photos made by the Mac helper script (named SID_1.jpg, SID_2.jpg…). They attach to the matching specimens.</p><input type="file" id="ap" accept="image/*" multiple><progress id="apr" value="0" max="1" style="width:100%"></progress><p id="alog"></p></div>
<div class="card"><h2>Bulk tools</h2><label><input type="checkbox" id="ow" style="width:auto"> Overwrite existing Date values</label><button id="bd" style="margin:6px 0">Extract Date from tags</button>
<label><input type="checkbox" id="rc" style="width:auto"> Replace colors (instead of merging)</label><button id="bc" style="margin:6px 0">Extract colors from tags</button><p id="blog"></p></div>
<div class="card"><h2>Photo packs (from first app)</h2><p class="sub">Select the photopack-*.json files. Photos attach to the specimens loaded from the first app's JSON.</p><input type="file" id="pk" accept=".json" multiple><p id="plog"></p></div>
<div class="card"><h2>Export / backup</h2><p class="sub" id="stat"></p><div class="row"><button class="p" id="ej">Backup JSON</button><button id="ec">Export CSV</button></div><label>Restore from backup<input type="file" id="rs" accept=".json"></label></div>`;
$('#imp').onchange=async e=>{const log=$('#ilog');log.textContent='Reading file…';try{if(typeof XLSX==='undefined')await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('Spreadsheet reader could not load. Check your connection and reopen the app.'));document.head.appendChild(s)});for(const f of e.target.files)await importFile(f)}catch(err){log.textContent='Import problem: '+err.message}};
$('#ap').onchange=async e=>{const log=$('#alog'),fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));let n=0,miss=0,i=0;$('#apr').max=fs.length;
for(const f of fs){i++;$('#apr').value=i;log.textContent=`Photo ${i} of ${fs.length}…`;const m=f.name.match(/^(.+)_(\d+)\.[a-z]+$/i),x=m&&S.find(z=>z.sid===m[1]);if(!x){miss++;continue}
if(x.photos.some(p=>p.src===f.name))continue;const u=await shrink(f);if(!u){miss++;continue}x.photos.push({data:u,role:m[2]==='1'?'front':'detail',src:f.name});await save(x);n++}
log.textContent=`${n} photos attached, ${miss} skipped (no matching specimen or unreadable).`};
$('#bd').onclick=bulkDate;$('#bc').onclick=bulkColor;$('#ej').onclick=()=>out('leilas-journal-backup.json',JSON.stringify({templates:T,specimens:S},null,1),'application/json');
$('#ec').onclick=csv;$('#stat').textContent=`Saved on this device: ${S.length} specimens, ${S.reduce((a,x)=>a+x.photos.length,0)} photos, ${S.reduce((a,x)=>a+(x.pending||[]).length,0)} photos waiting.`;
$('#rs').onchange=async e=>{const j=JSON.parse(await e.target.files[0].text());let n=0,m=0;for(const y of j.specimens){const x=y.templateId?conv(y):y;const old=x.sid&&S.find(z=>z.sid===x.sid&&z.id!==x.id);if(old){x.id=old.id;x.added=old.added;m++}await save(x);n++}alert(`Loaded ${n} specimens (${m} replaced existing records with the same SID)`);home()};
$('#pk').onchange=async e=>{const log=$('#plog');let n=0;const idx=new Map();S.forEach(x=>(x.pending||[]).forEach(p=>idx.set(p.path,{x,p})));
try{for(const f of e.target.files){const j=JSON.parse(await f.text());for(const [path,data] of Object.entries(j.photos||{})){const h=idx.get(path);if(!h||!data)continue;h.x.photos.push({data,role:h.p.role});h.x.pending=h.x.pending.filter(p=>p.path!==path);idx.delete(path);await save(h.x);n++;log.textContent=`${n} photos attached…`}}
log.textContent=`${n} photos attached. ${idx.size} still waiting for a photo pack.`}catch(err){log.textContent='Problem: '+err.message}};}
async function out(name,text,type){const f=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{return await navigator.share({files:[f]})}catch(e){if(e.name==='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
function csv(){const rows=[['name','category','tags','notes','storage','folder','price','purchase_date','value','year','acquired','source','sid','colors','fields','photo_count']];
S.forEach(x=>rows.push([x.name,x.cat,x.tags.join('; '),x.notes,x.storage,x.folder,x.price,x.pdate,x.value,x.year,x.acquired,x.source,x.sid,(x.colors||[]).join('; '),JSON.stringify(x.f),x.photos.length]));
out('leilas-journal-export.csv',rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
// ---- color / date logic ----
const colorOf=t=>{let s=t.trim().toLowerCase().replace(/\s*colou?r$/,'').replace(/^multi[\s-]?colou?r(ed)?$/,'multi-color');return COLORS.find(c=>c.toLowerCase()===s)};
const yearOf=x=>{const m=(x.tags.join(' ')+' '+x.notes).match(/\b(19\d\d|20\d\d)\b/);return m?+m[1]:''};
function bulkDate(){let n=0;S.forEach(async x=>{const y=yearOf(x);if(y&&($('#ow').checked||!x.year)){x.year=y;n++;await save(x)}});$('#blog').textContent=`Date set on ${n} specimens.`}
async function bulkColor(){let n=0;for(const x of S){const hit=x.tags.map(colorOf).filter(Boolean);if(!hit.length)continue;n++;
x.colors=$('#rc').checked?[...new Set(hit)]:[...new Set([...(x.colors||[]),...hit])];x.tags=x.tags.filter(t=>!colorOf(t));
const pk=PLACE[x.cat];if(x.f[pk]&&x.f[pk].includes(','))x.f[pk]=x.f[pk].split(',').map(s=>s.trim()).filter(p=>!colorOf(p)).join(', ');await save(x)}
$('#blog').textContent=`Colors extracted for ${n} specimens.`}
// ---- Sortly import ----
async function importFile(f){const log=$('#ilog'),nm=f.name.toLowerCase(),cat=nm.includes('mineral')?'mineral':nm.includes('fossil')?'fossil':'artifact';
const wb=XLSX.read(await f.arrayBuffer());let best=[];for(const n of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});if(a.length>best.length)best=a}
const hi=best.findIndex(r=>r.some(c=>/name/i.test(String(c))));
if(hi<0){log.textContent=`${f.name}: no Name column found. Rows read: ${best.length}. First row: ${(best[0]||[]).join(' | ').slice(0,300)}`;return}
const H=best[hi].map(c=>String(c).trim()),rows=best.slice(hi+1).map(a=>{const o={};H.forEach((h,i)=>{if(h)o[h]=a[i]});return o});
const nameK=H.find(h=>/name/i.test(h)&&!/folder/i.test(h)),sidK=H.find(h=>/^(sid|sortly id|id)$/i.test(h))||H.find(h=>/sid|sortly/i.test(h)),typeK=H.find(h=>/type/i.test(h));
const g=(r,re)=>{const k=H.find(h=>re.test(h));return k?r[k]:''};
const photoKeys=H.filter(h=>/photo|image|picture/i.test(h)),folderKeys=H.filter(h=>/folder/i.test(h));
let added=0,skip=0,ph=0,i=0,nonItem=0,noNet=0,blocked=0;
for(const r of rows){i++;$('#ipr').max=rows.length;$('#ipr').value=i;log.textContent=`${f.name}: row ${i} of ${rows.length}…`;
const name=String(r[nameK]??'').trim();if(!name||(typeK&&/folder/i.test(r[typeK]))){nonItem++;continue}
const sid=sidK?String(r[sidK]).trim():'';if(sid&&S.some(x=>x.sid===sid)){skip++;continue}
const tags=String(g(r,/^tags?$/i)).split(/[,;]/).map(s=>s.trim()).filter(Boolean),folder=folderKeys.map(k=>String(r[k]).trim()).filter(Boolean).join(' / ');
const x={id:uid(),added:Date.now(),name,cat,tags,notes:String(g(r,/^notes?$/i)),storage:'',folder,price:+g(r,/price/i)||'',pdate:String(g(r,/purchase.*date|^date$/i)),value:+g(r,/^(total )?value/i)||'',year:'',acquired:'',source:'',sid,photos:[],f:{},colors:[]};
x.f[MAIN[cat]]=name;x.year=yearOf(x);
x.colors=[...new Set(tags.map(colorOf).filter(Boolean))];x.tags=tags.filter(t=>!colorOf(t));
if(x.tags.length)x.f[PLACE[cat]]=x.tags.join(', ');
const urls=($('#nop')&&$('#nop').checked)?[]:photoKeys.flatMap(k=>String(r[k]).split(/[\s,;|]+/)).filter(u=>/^https?:/.test(u));
for(const u of urls){if(noNet>=3){blocked++;continue}try{const u2=await shrink(await (await fetch(u,{signal:AbortSignal.timeout(8000)})).blob());if(u2){x.photos.push({data:u2,role:x.photos.length?'detail':'front'});ph++;noNet=0}}catch(e){noNet++;blocked++}}
await save(x);added++}
log.textContent=`${f.name}: ${rows.length} rows read, ${added} added, ${skip} duplicates skipped, ${nonItem} non-item rows ignored, ${ph} photos downloaded.`+(blocked?` The browser can't download Sortly photos directly (${blocked}+ blocked); use the photo helper script, then Attach photos below.`:'')+(added||skip?'':` Columns found: ${H.join(' | ')}`)}
// ---- boot ----
(async()=>{DB=await idb();await load();try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
